name: Holland2Stay monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub sometimes runs it a little late)
  workflow_dispatch:        # lets you tap "Run workflow" to test

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DETAIL_CHECKS: "0" 
        run: python monitor.py
      - name: Remember what was seen
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen listings" && git push)
